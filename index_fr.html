<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYDE — Carte des hubs de redevabilité</title>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<!-- Replace with your Adobe Fonts kit URL to load avenir-lt-pro:
     <link rel="stylesheet" href="https://use.typekit.net/XXXXXXX.css"> -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <header class="intro">
    <div>
      <span class="eyebrow">Hubs de redevabilité WYDE</span>
      <h1 class="headline">Récits depuis <em>l’Afrique subsaharienne</em></h1>
    </div>
    <div class="meta-line">
      <span class="stat"><strong id="stat-stories">…</strong><span id="label-stories">récits</span></span>
      <span class="sep" aria-hidden="true"></span>
      <span class="stat"><strong id="stat-countries">…</strong><span id="label-countries">pays</span></span>
      <span class="sep" aria-hidden="true"></span>
      <span class="hint" id="label-hint">Survolez ou touchez un marqueur</span>
    </div>
  </header>

  <div class="svg-host" id="host">
    <div class="status" id="status">Chargement…</div>
  </div>

  <section class="index">
    <div class="index-head">
      <span class="eyebrow" id="label-index">Index par pays</span>
      <span class="index-hint" id="label-index-hint">Cliquez pour voir les récits</span>
    </div>
    <ol class="country-list" id="chips"></ol>
  </section>

</div>

<script>
  window.PAGE_DEFAULTS = { lang: 'fr', template: 'single-microsite-wyde-fr' };
</script>
<script src="map.js"></script>
</body>
</html>
